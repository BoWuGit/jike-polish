<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>即刻 Web 美化</title>
    <link rel="stylesheet" href="../Style.css">
    <script src="../Script.js" defer></script>
</head>
<body>
    <main>
        <img class="app-icon" src="../Icon.png" width="112" height="112" alt="">
        <h1>即刻 Web 美化</h1>
        <p class="summary">让即刻 Web 的阅读、引用卡片和图片浏览体验更顺手。</p>

        <section class="status" aria-live="polite">
            <p class="state-unknown">请在 Safari 的“扩展”设置中启用本扩展。</p>
            <p class="state-on"><span class="dot" aria-hidden="true"></span>扩展已启用，打开即刻 Web 即可使用。</p>
            <p class="state-off"><span class="dot" aria-hidden="true"></span>扩展尚未启用。</p>
        </section>

        <button class="open-preferences" type="button">退出并打开 Safari 设置…</button>
        <p class="hint">只会在 web.okjike.com 上运行。</p>
    </main>
</body>
</html>
